<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>saywhat</title>
  <!-- Black on light tabs, white on dark tabs -->
  <style>
    .bubble { fill: #0a0a0a; }
    .spark { fill: #fff; }
    @media (prefers-color-scheme: dark) {
      .bubble { fill: #fff; }
      .spark { fill: #0a0a0a; }
    }
  </style>
