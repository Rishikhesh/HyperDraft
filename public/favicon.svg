<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>HyperDraft</title>
  <!-- Black on light tabs, white on dark tabs -->
  <style>
    .page { fill: #0a0a0a; }
    .ink { fill: #fff; }
    @media (prefers-color-scheme: dark) {
      .page { fill: #fff; }
      .ink { fill: #0a0a0a; }
    }
  </style>
  <!-- A draft page… -->
  <rect class="page" x="3" y="3" width="26" height="26" rx="7"/>
  <rect class="ink" x="8" y="9" width="7" height="2.5" rx="1.25" opacity=".55"/>
  <rect class="ink" x="8" y="20.5" width="5" height="2.5" rx="1.25" opacity=".55"/>
  <!-- …made at hyper speed -->
  <path class="ink" d="M19.5 6.5 12.5 17h5l-1.5 8.5 7.5-11h-5.2z"/>
</svg>
